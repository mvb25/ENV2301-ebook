<g font-family="Arial,sans-serif" fill="#173c54"><text x="34" y="620" font-size="20" font-weight="700">Evidence on the map</text><text x="34" y="650" font-size="17">Locations A–C: counts at specified times  •  orange dashed line: participant-guided walking route</text></g>
<!-- right panel -->
<rect x="848" y="18" width="354" height="654" rx="18" fill="#f2f8fa" stroke="#cadde8" stroke-width="2"/>
<text x="874" y="57" font-family="Arial" font-weight="700" font-size="22" fill="#17476b">Three kinds of evidence</text>
<g font-family="Arial" fill="#25475f"><rect x="871" y="83" width="307" height="141" rx="12" fill="#e2f0f8"/>
<circle cx="897" cy="109" r="11" fill="#2e7297"/><text x="920" y="115" font-size="19" font-weight="700">Structured observation</text><text x="882" y="144" font-size="17">Who passes A, B and C? At what</text><text x="882" y="168" font-size="17">time and during which conditions?</text><text x="882" y="203" font-size="16" fill="#5b7180">Counts cannot explain motives.</text>
<rect x="871" y="239" width="307" height="153" rx="12" fill="#e9f3e9"/>
<circle cx="897" cy="268" r="11" fill="#477c52"/><text x="920" y="274" font-size="19" font-weight="700">Walking interview</text><text x="882" y="307" font-size="17">How does the route feel to users?</text><text x="882" y="331" font-size="17">Which places do they notice?</text><text x="882" y="366" font-size="16" fill="#5b7180">Accounts are situated, not</text><text x="882" y="386" font-size="16" fill="#5b7180">population prevalence estimates.</text>
<rect x="871" y="408" width="307" height="153" rx="12" fill="#f8efe3"/>
<circle cx="897" cy="437" r="11" fill="#c78530"/><text x="920" y="444" font-size="19" font-weight="700">Context &amp; management</text><text x="882" y="477" font-size="17">Shade, benches, route connections,</text><text x="882" y="501" font-size="17">signage and maintenance decisions</text><text x="882" y="536" font-size="16" fill="#5b7180">A visible feature does not prove</text><text x="882" y="556" font-size="16" fill="#5b7180">why it was installed.</text></g>
<text x="872" y="601" font-family="Arial" font-size="16" fill="#436577">Illustrative scheme, not a surveyed</text><text x="872" y="624" font-family="Arial" font-size="16" fill="#436577">map or data from Labrador Park.</text>
</svg>