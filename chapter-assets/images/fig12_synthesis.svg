<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">From qualitative investigation to a defensible explanation: Chapters 11 and 12</title><desc id="desc">Six connected stages: selecting perspectives, collecting accounts, examining practices and records, comparing accounts, evaluating explanations, and integrating sources. The process is iterative.</desc>
