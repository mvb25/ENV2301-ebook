<text x="175" y="572" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#2f5f42">Trees, shrubs and</text><text x="175" y="601" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#2f5f42">ground vegetation</text>
