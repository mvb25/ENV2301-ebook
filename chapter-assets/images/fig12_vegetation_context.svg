<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 835" role="img" aria-labelledby="t d">
<title id="t">Vegetation, physical conditions, experience and route use</title><desc id="d">Vegetation determines local shade, visibility and physical access. Context modifies how people experience those conditions. These experiences and perceptions influence route use.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#4a6d81"/></marker><marker id="arrctx" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#ad7d34"/></marker></defs>
<rect width="1520" height="835" fill="#f8fbfa" rx="24"/>
<text x="55" y="56" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#193c5a">How vegetation influences route choice</text>
<text x="55" y="92" font-family="Arial,sans-serif" font-size="20" fill="#4a6474">Physical conditions and people’s experiences provide different parts of the explanation</text>
<g font-family="Arial,sans-serif" fill="#173c58" font-size="23" font-weight="700" text-anchor="middle"><text x="190" y="158">Vegetation</text><text x="545" y="158">Physical conditions</text><text x="995" y="158">Experience and perception</text><text x="1370" y="158">Route use</text></g>
