<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="480" viewBox="0 0 1230 480" role="img"><text x="35" y="44" text-anchor="start" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#244859">A place can mean different things to different participants</text><text x="35" y="73" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#244859">Illustrative community mapping exercise — not empirical data</text><rect x="40" y="108" width="535" height="280" rx="12" fill="#f2f7ed" stroke="#bdd4b0" stroke-width="2"/><text x="58" y="138" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17465a">Location and activity</text><text x="58" y="167" font-family="Arial, sans-serif" font-size="17" fill="#274450">Wooded trail: shade and quiet</text><text x="58" y="193" font-family="Arial, sans-serif" font-size="17" fill="#274450">Open lawn: play and gathering</text><text x="58" y="219" font-family="Arial, sans-serif" font-size="17" fill="#274450">Coastal path: recreation and views</text><text x="58" y="245" font-family="Arial, sans-serif" font-size="17" fill="#274450">Entrance: access for some, barrier for others</text><rect x="615" y="108" width="565" height="280" rx="12" fill="#eef4f9" stroke="#aac9d9" stroke-width="2"/><text x="633" y="138" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#17465a">Information generated in discussion</text><text x="633" y="167" font-family="Arial, sans-serif" font-size="17" fill="#274450">Why is a place important, and to whom?</text><text x="633" y="193" font-family="Arial, sans-serif" font-size="17" fill="#274450">When is it accessible or difficult to use?</text><text x="633" y="219" font-family="Arial, sans-serif" font-size="17" fill="#274450">Which histories or uses are missing?</text><text x="633" y="245" font-family="Arial, sans-serif" font-size="17" fill="#274450">Where do participants disagree?</text><text x="605" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#244859">Record the discussion and disagreements as well as the final map.</text></svg>