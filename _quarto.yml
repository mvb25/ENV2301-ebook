  page-navigation: true

  reader-mode: true
  search:
    location: navbar
    type: overlay
bibliography: references.bib

format:
  html:
    theme: cosmo
    css:
    - styles.css
    - styles-2026-10.css
    - styles-learning.css
    - chapter-assets/academic-monograph.css
    toc: true
    toc-depth: 2
    number-sections: false
    code-fold: true
    code-tools: false
    smooth-scroll: true
    include-in-header: chapter-assets/book-head.html
    citations-hover: true
    link-citations: true
    include-after-body: glossary.js

execute:
  freeze: auto
